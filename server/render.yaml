services:
  - type: web
    name: nexus-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_MEDIA_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_MEDIA_API_KEY
        sync: false
      - key: CLOUDINARY_MEDIA_API_SECRET
        sync: false
